<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ceintures de calcul mental — CM2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --fond: #ffffff;
    --texte: #14171a;
    --texte-att: #5a6169;
    --bordure: #d8dce0;
    --accent: #1f5fa8;
    --vert: #1f8a3d;
    --rouge: #c0342a;
    --fond-carte: #f6f7f8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem 2rem 3rem;
  }
  h1 {
    font-size: clamp(1.8rem, 3.2vw, 2.6rem);
    text-align: center;
    margin: 0.5rem 0 0.2rem;
  }
  h2 { font-size: 1.6rem; margin: 0 0 1rem; }
  .sous-titre {
    text-align: center;
    color: var(--texte-att);
    font-size: 1.3rem;
    margin: 0 0 2rem;
  }
  .entete-ecran {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }
  .entete-ecran h1 { margin: 0; text-align: left; }

  /* Boutons génériques */
  .bouton-lien {
    background: none;
    border: none;
    color: var(--texte-att);
    text-decoration: underline;
    font-size: 1rem;
    cursor: pointer;
    font-family: inherit;
    padding: 0.4rem 0;
  }
  .bouton-principal {
    font-size: 1.3rem;
    padding: 0.7rem 1.6rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    font-family: inherit;
  }
  .bouton-secondaire {
    font-size: 1.3rem;
    padding: 0.7rem 1.6rem;
    border-radius: 10px;
    border: 2px solid var(--bordure);
    background: #fff;
    color: var(--texte);
    cursor: pointer;
    font-family: inherit;
  }
  .bouton-danger {
    font-size: 1rem;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    border: 2px solid var(--rouge);
    background: #fff;
    color: var(--rouge);
    cursor: pointer;
    font-family: inherit;
  }

  /* Identification élève */
  .grille-eleves {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }
  .bouton-eleve {
    font-size: 1.4rem;
    font-weight: 600;
    padding: 1.3rem 1rem;
    border-radius: 12px;
    border: 2px solid var(--bordure);
    background: var(--fond-carte);
    cursor: pointer;
    font-family: inherit;
    color: var(--texte);
  }
  .bouton-eleve:hover, .bouton-eleve:focus-visible { border-color: var(--accent); outline: none; }
  .message-vide {
    text-align: center;
    color: var(--texte-att);
    font-size: 1.2rem;
    padding: 2rem 1rem;
  }
  .barre-basse { text-align: center; margin-top: auto; padding-top: 2rem; }

  /* Ceintures (par élève) */
  .grille-ceintures {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.2rem;
  }
  .carte-ceinture {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--fond-carte);
    border: 2px solid var(--bordure);
    border-radius: 14px;
    padding: 1.1rem 1.3rem;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    font-size: 1.15rem;
    color: var(--texte);
  }
  .carte-ceinture:hover, .carte-ceinture:focus-visible { border-color: var(--accent); outline: none; }
  .pastille {
    flex: none;
    width: 3.4rem;
    height: 3.4rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 1.4rem;
    border: 2px solid rgba(0,0,0,0.15);
  }
  .pastille.petite { width: 2.1rem; height: 2.1rem; font-size: 0.95rem; }
  .carte-info { flex: 1; }
  .carte-nom { font-weight: 700; font-size: 1.3rem; }
  .carte-statut { color: var(--texte-att); font-size: 1rem; margin-top: 0.15rem; }
  .carte-statut.valide { color: var(--vert); font-weight: 600; }

  /* Écran de session */
  .entete-session {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 1.2rem;
    color: var(--texte-att);
    margin-bottom: 0.6rem;
  }
  .piste-chrono {
    height: 10px;
    background: var(--bordure);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 2.5rem;
  }
  .barre-chrono { height: 100%; width: 100%; background: var(--accent); }
  .zone-question {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 40vh;
  }
  .enonce {
    font-size: clamp(2.6rem, 7vw, 5.2rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 2rem;
    transition: color 0.15s ease;
  }
  .enonce.correct { color: var(--vert); }
  .enonce.incorrect { color: var(--rouge); }
  .reponse-correcte { font-size: 1.6rem; color: var(--texte-att); min-height: 2.2rem; }
  .champ-reponse {
    font-size: 2.6rem;
    text-align: center;
    width: 8rem;
    padding: 0.3rem 0.5rem;
    border: 3px solid var(--bordure);
    border-radius: 10px;
    font-family: inherit;
  }
  .champ-reponse:focus { outline: none; border-color: var(--accent); }
  .bouton-valider {
    font-size: 1.6rem;
    padding: 0.5rem 1.6rem;
    margin-left: 1rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .ligne-saisie { display: flex; align-items: center; justify-content: center; }
  .choix-boutons { display: flex; gap: 1.2rem; }
  .bouton-choix {
    font-size: 3rem;
    width: 6rem;
    height: 4.2rem;
    border-radius: 12px;
    border: 3px solid var(--bordure);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
  }
  .bouton-choix:hover, .bouton-choix:focus-visible { border-color: var(--accent); outline: none; }

  /* Écran de résultats */
  .resultats {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.2rem;
  }
  .score-final { font-size: clamp(3rem, 8vw, 5.5rem); font-weight: 700; }
  .message-final { font-size: 1.7rem; }
  .message-final.reussi { color: var(--vert); }
  .message-final.a-revoir { color: var(--texte-att); }
  .actions-resultats { display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }

  /* Espace enseignant */
  .bloc {
    background: var(--fond-carte);
    border: 2px solid var(--bordure);
    border-radius: 14px;
    padding: 1.3rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .bloc h2 { margin-top: 0; }
  .ligne-formulaire { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
  .champ-texte {
    font-size: 1.2rem;
    padding: 0.5rem 0.8rem;
    border: 2px solid var(--bordure);
    border-radius: 8px;
    font-family: inherit;
    flex: 1;
    min-width: 12rem;
  }
  .liste-classe { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .liste-classe li {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #fff;
    border: 2px solid var(--bordure);
    border-radius: 999px;
    padding: 0.35rem 0.5rem 0.35rem 1rem;
    font-size: 1.05rem;
  }
  .liste-classe button {
    border: none;
    background: var(--rouge);
    color: #fff;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  .zone-scroll { overflow-x: auto; }
  table.suivi { border-collapse: collapse; width: 100%; font-size: 1rem; }
  table.suivi th, table.suivi td {
    border: 1px solid var(--bordure);
    padding: 0.5rem 0.6rem;
    text-align: center;
    white-space: nowrap;
  }
  table.suivi th.nom-eleve, table.suivi td.nom-eleve { text-align: left; }
  table.suivi td.valide { color: var(--vert); font-weight: 700; }
  table.suivi td.non-tente { color: var(--texte-att); }
  .actions-enseignant { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.8rem; }
  .message-etat { font-size: 1rem; margin-top: 0.8rem; }
  .message-etat.succes { color: var(--vert); }
  .message-etat.erreur { color: var(--rouge); }
  .bouton-fichier { position: relative; overflow: hidden; display: inline-block; }
  .bouton-fichier input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #14171a;
      --texte: #f2f3f4;
      --texte-att: #a6adb4;
      --bordure: #3a3f45;
      --fond-carte: #1d2124;
      --accent: #4d8fd6;
    }
    .champ-reponse, .bouton-choix, .bouton-secondaire, .champ-texte, .liste-classe li { background: #1d2124; color: var(--texte); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ==========================================================================
   Générateurs d'items — généré depuis generateurs.mjs (ne pas éditer ici)
   ========================================================================== */
function randInt(min, max, rng = Math.random) {
  return Math.floor(rng() * (max - min + 1)) + min;
}

function pick(arr, rng = Math.random) {
  return arr[randInt(0, arr.length - 1, rng)];
}

function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  while (b) {
    [a, b] = [b, a % b];
  }
  return a || 1;
}

function fmtFR(n) {
  // affichage français d'un nombre (virgule décimale)
  return String(n).replace('.', ',');
}

function fraction(num, denom) {
  const g = gcd(num, denom);
  return { num: num / g, denom: denom / g };
}

function toNumericValue(raw) {
  if (raw === undefined || raw === null) return NaN;
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '').replace(',', '.');
  if (s === '') return NaN;
  const fracMatch = s.match(/^(-?\d+)\/(\d+)$/);
  if (fracMatch) {
    const n = Number(fracMatch[1]);
    const d = Number(fracMatch[2]);
    if (d === 0) return NaN;
    return n / d;
  }
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Number(s);
}

function checkAnswer(item, userInput) {
  if (item.type === 'choix') {
    const s = String(userInput).trim().toLowerCase();
    return item.accept.some((a) => String(a).trim().toLowerCase() === s);
  }
  const v = toNumericValue(userInput);
  if (Number.isNaN(v)) return false;
  return item.accept.some((a) => {
    const av = toNumericValue(a);
    return !Number.isNaN(av) && Math.abs(av - v) < 1e-9;
  });
}

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c1_complement10(rng) {
  const a = randInt(1, 9, rng);
  const b = 10 - a;
  return {
    enonce: `${a} + ? = 10`,
    reponse: String(b),
    accept: [String(b)],
    type: 'nombre',
  };
}

function c1_complement100(rng) {
  const a = randInt(1, 9, rng) * 10;
  const b = 100 - a;
  return {
    enonce: `${a} + ? = 100`,
    reponse: String(b),
    accept: [String(b)],
    type: 'nombre',
  };
}

function c1_addition(rng) {
  const a = randInt(1, 9, rng);
  const b = randInt(1, 9, rng);
  return {
    enonce: `${a} + ${b} = ?`,
    reponse: String(a + b),
    accept: [String(a + b)],
    type: 'nombre',
  };
}

function c1_soustraction(rng) {
  const a = randInt(11, 20, rng);
  const b = randInt(1, 9, rng);
  return {
    enonce: `${a} - ${b} = ?`,
    reponse: String(a - b),
    accept: [String(a - b)],
    type: 'nombre',
  };
}

const CEINTURE_1 = [c1_complement10, c1_complement100, c1_addition, c1_soustraction];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c2_double(rng) {
  const n = randInt(1, 50, rng);
  return {
    enonce: `Double de ${n} = ?`,
    reponse: String(n * 2),
    accept: [String(n * 2)],
    type: 'nombre',
  };
}

function c2_moitie(rng) {
  const n = randInt(1, 50, rng) * 2;
  return {
    enonce: `Moitié de ${n} = ?`,
    reponse: String(n / 2),
    accept: [String(n / 2)],
    type: 'nombre',
  };
}

function c2_table_2_5_10(rng) {
  const table = pick([2, 5, 10], rng);
  const facteur = randInt(1, 10, rng);
  return {
    enonce: `${table} × ${facteur} = ?`,
    reponse: String(table * facteur),
    accept: [String(table * facteur)],
    type: 'nombre',
  };
}

function c2_mult_10_100(rng) {
  const n = randInt(1, 99, rng);
  const mult = pick([10, 100], rng);
  return {
    enonce: `${n} × ${mult} = ?`,
    reponse: String(n * mult),
    accept: [String(n * mult)],
    type: 'nombre',
  };
}

const CEINTURE_2 = [c2_double, c2_moitie, c2_table_2_5_10, c2_mult_10_100];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c3_table(rng) {
  const a = randInt(2, 9, rng);
  const b = randInt(2, 9, rng);
  return {
    enonce: `${a} × ${b} = ?`,
    reponse: String(a * b),
    accept: [String(a * b)],
    type: 'nombre',
  };
}

function c3_division(rng) {
  const a = randInt(2, 9, rng);
  const b = randInt(2, 9, rng);
  const produit = a * b;
  return {
    enonce: `${produit} ÷ ${a} = ?`,
    reponse: String(b),
    accept: [String(b)],
    type: 'nombre',
  };
}

function c3_facteur_manquant(rng) {
  const a = randInt(2, 9, rng);
  const b = randInt(2, 9, rng);
  const produit = a * b;
  return {
    enonce: `? × ${a} = ${produit}`,
    reponse: String(b),
    accept: [String(b)],
    type: 'nombre',
  };
}

const CEINTURE_3 = [c3_table, c3_division, c3_facteur_manquant];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c4_addition_ronde(rng) {
  const base = pick([10, 100], rng);
  const a = randInt(1, 90, rng) * base;
  const b = randInt(1, 90, rng) * base;
  return {
    enonce: `${a} + ${b} = ?`,
    reponse: String(a + b),
    accept: [String(a + b)],
    type: 'nombre',
  };
}

function c4_soustraction_ronde(rng) {
  const base = pick([10, 100], rng);
  const a = randInt(10, 99, rng) * base;
  const b = randInt(1, 9, rng) * base;
  return {
    enonce: `${a} - ${b} = ?`,
    reponse: String(a - b),
    accept: [String(a - b)],
    type: 'nombre',
  };
}

function c4_mult_2chiffres(rng) {
  const a = randInt(11, 49, rng);
  const b = randInt(2, 9, rng);
  return {
    enonce: `${a} × ${b} = ?`,
    reponse: String(a * b),
    accept: [String(a * b)],
    type: 'nombre',
  };
}

function c4_multdiv_puissance10(rng) {
  const n = randInt(1, 90, rng) * 10;
  const puissance = pick([10, 100, 1000], rng);
  const op = pick(['×', '÷'], rng);
  if (op === '×') {
    return {
      enonce: `${n} × ${puissance} = ?`,
      reponse: String(n * puissance),
      accept: [String(n * puissance)],
      type: 'nombre',
    };
  }
  const dividende = n * puissance;
  return {
    enonce: `${dividende} ÷ ${puissance} = ?`,
    reponse: String(n),
    accept: [String(n)],
    type: 'nombre',
  };
}

const CEINTURE_4 = [c4_addition_ronde, c4_soustraction_ronde, c4_mult_2chiffres, c4_multdiv_puissance10];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c5_addition_decimaux(rng) {
  const a = randInt(1, 99, rng) / 10;
  const b = randInt(1, 99, rng) / 10;
  const somme = Math.round((a + b) * 10) / 10;
  return {
    enonce: `${fmtFR(a)} + ${fmtFR(b)} = ?`,
    reponse: fmtFR(somme),
    accept: [String(somme), fmtFR(somme)],
    type: 'nombre',
  };
}

function c5_soustraction_decimaux(rng) {
  const a = randInt(10, 99, rng) / 10;
  const b = randInt(1, Math.round(a * 10) - 1, rng) / 10;
  const diff = Math.round((a - b) * 10) / 10;
  return {
    enonce: `${fmtFR(a)} - ${fmtFR(b)} = ?`,
    reponse: fmtFR(diff),
    accept: [String(diff), fmtFR(diff)],
    type: 'nombre',
  };
}

function c5_mult_puissance10(rng) {
  const n = randInt(1, 999, rng) / 10;
  const puissance = pick([10, 100, 1000], rng);
  const resultat = Math.round(n * puissance * 100) / 100;
  return {
    enonce: `${fmtFR(n)} × ${puissance} = ?`,
    reponse: fmtFR(resultat),
    accept: [String(resultat), fmtFR(resultat)],
    type: 'nombre',
  };
}

function c5_comparer(rng) {
  const a = randInt(1, 99, rng) / 10;
  let b = randInt(1, 99, rng) / 10;
  if (rng() < 0.2) b = a; // égalités parfois
  const symbole = a < b ? '<' : a > b ? '>' : '=';
  return {
    enonce: `${fmtFR(a)}  ?  ${fmtFR(b)}`,
    reponse: symbole,
    accept: [symbole],
    type: 'choix',
    choix: ['<', '=', '>'],
  };
}

const CEINTURE_5 = [c5_addition_decimaux, c5_soustraction_decimaux, c5_mult_puissance10, c5_comparer];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c6_fraction_de_quantite(rng) {
  const denom = pick([2, 3, 4, 5, 10], rng);
  const num = randInt(1, denom - 1, rng);
  const k = randInt(2, 12, rng);
  const quantite = denom * k;
  const resultat = num * k;
  return {
    enonce: `${num}/${denom} de ${quantite} = ?`,
    reponse: String(resultat),
    accept: [String(resultat)],
    type: 'nombre',
  };
}

function c6_ecriture_decimale(rng) {
  const denom = pick([10, 100], rng);
  const num = randInt(1, denom - 1, rng);
  const decimal = Math.round((num / denom) * 100) / 100;
  return {
    enonce: `${num}/${denom} = ?`,
    reponse: fmtFR(decimal),
    accept: [String(decimal), fmtFR(decimal)],
    type: 'nombre',
  };
}

function c6_somme_fractions(rng) {
  const denom = pick([2, 3, 4, 5, 6, 8, 10], rng);
  const num1 = randInt(1, denom - 2, rng);
  const num2 = randInt(1, denom - 1 - num1, rng);
  const somme = num1 + num2;
  const reduite = fraction(somme, denom);
  const canonique = `${reduite.num}/${reduite.denom}`;
  const brute = `${somme}/${denom}`;
  const decimal = Math.round((somme / denom) * 1000) / 1000;
  return {
    enonce: `${num1}/${denom} + ${num2}/${denom} = ?`,
    reponse: canonique,
    accept: [canonique, brute, String(decimal), fmtFR(decimal)],
    type: 'nombre',
  };
}

function c6_comparer_a_un(rng) {
  const denom = randInt(2, 10, rng);
  let num = randInt(1, denom + 3, rng);
  if (num === denom && rng() < 0.5) num = denom; // garde parfois l'égalité
  const symbole = num < denom ? '<' : num > denom ? '>' : '=';
  return {
    enonce: `${num}/${denom}  ?  1`,
    reponse: symbole,
    accept: [symbole],
    type: 'choix',
    choix: ['<', '=', '>'],
  };
}

const CEINTURE_6 = [c6_fraction_de_quantite, c6_ecriture_decimale, c6_somme_fractions, c6_comparer_a_un];

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------

function c7_pourcentage(rng) {
  const pourcentage = pick([10, 25, 50, 75], rng);
  const diviseur = pourcentage === 10 ? 10 : pourcentage === 50 ? 2 : 4; // 25 % et 75 % -> quarts
  const k = randInt(1, 20, rng);
  const base = diviseur * k;
  const resultat = (base * pourcentage) / 100;
  return {
    enonce: `${pourcentage} % de ${base} = ?`,
    reponse: String(resultat),
    accept: [String(resultat)],
    type: 'nombre',
  };
}

function c7_proportionnalite(rng) {
  const objets = ['stylos', 'cahiers', 'billes', 'gâteaux', 'images', 'bonbons'];
  const objet = pick(objets, rng);
  const u = randInt(2, 6, rng);
  const prixUnitaire = randInt(2, 15, rng);
  const m = randInt(2, 6, rng);
  const quantite2 = u * m;
  const prixU = u * prixUnitaire;
  const reponse = quantite2 * prixUnitaire;
  return {
    enonce: `Si ${u} ${objet} coûtent ${prixU} €, combien coûtent ${quantite2} ${objet} ?`,
    reponse: String(reponse),
    accept: [String(reponse)],
    type: 'nombre',
  };
}

function c7_ordre_grandeur(rng) {
  const a = randInt(1, 9, rng) * 100 + randInt(0, 9, rng) * 10 + randInt(0, 9, rng);
  const b = randInt(2, 9, rng);
  const aArrondi = Math.round(a / 100) * 100;
  const estimation = aArrondi * b;
  return {
    enonce: `Ordre de grandeur (à la centaine) de ${a} × ${b} = ?`,
    reponse: String(estimation),
    accept: [String(estimation)],
    type: 'nombre',
  };
}

function c7_vitesse(rng) {
  const v = randInt(1, 12, rng) * 10;
  const t = randInt(1, 6, rng);
  const distance = v * t;
  return {
    enonce: `Une voiture roule à ${v} km/h pendant ${t} h. Distance parcourue (en km) ?`,
    reponse: String(distance),
    accept: [String(distance)],
    type: 'nombre',
  };
}

const CEINTURE_7 = [c7_pourcentage, c7_proportionnalite, c7_ordre_grandeur, c7_vitesse];

// ---------------------------------------------------------------------------

function c8_distributivite(rng) {
  const a = randInt(2, 12, rng);
  const proche = pick([98, 99, 101, 102, 998, 999, 1001, 1002], rng);
  const resultat = a * proche;
  return {
    enonce: `${a} × ${proche} = ?`,
    reponse: String(resultat),
    accept: [String(resultat)],
    type: 'nombre',
  };
}

function c8_calcul_combine(rng) {
  const a = randInt(2, 12, rng);
  const b = randInt(2, 12, rng);
  const c = randInt(2, 20, rng);
  const forme = pick(['somme_fois', 'fois_moins', 'moins_fois'], rng);
  if (forme === 'somme_fois') {
    const resultat = (a + b) * c;
    return {
      enonce: `(${a} + ${b}) × ${c} = ?`,
      reponse: String(resultat),
      accept: [String(resultat)],
      type: 'nombre',
    };
  }
  if (forme === 'fois_moins') {
    const resultat = a * b - c;
    return {
      enonce: `${a} × ${b} - ${c} = ?`,
      reponse: String(resultat),
      accept: [String(resultat)],
      type: 'nombre',
    };
  }
  const d = a * b + randInt(1, 20, rng);
  const resultat = d - a * b;
  return {
    enonce: `${d} - (${a} × ${b}) = ?`,
    reponse: String(resultat),
    accept: [String(resultat)],
    type: 'nombre',
  };
}

function c8_grands_nombres(rng) {
  const type = pick(['mult', 'div'], rng);
  if (type === 'mult') {
    const a = randInt(2, 9, rng) * 10;
    const b = randInt(2, 9, rng) * 10;
    const resultat = a * b;
    return {
      enonce: `${a} × ${b} = ?`,
      reponse: String(resultat),
      accept: [String(resultat)],
      type: 'nombre',
    };
  }
  const puissance = pick([10, 100, 1000], rng);
  const quotient = randInt(2, 90, rng);
  const dividende = quotient * puissance;
  return {
    enonce: `${dividende} ÷ ${puissance} = ?`,
    reponse: String(quotient),
    accept: [String(quotient)],
    type: 'nombre',
  };
}

function c8_mix(rng) {
  const toutesCeintures = [CEINTURE_4, CEINTURE_5, CEINTURE_6, CEINTURE_7];
  const ceinture = pick(toutesCeintures, rng);
  const generateur = pick(ceinture, rng);
  return generateur(rng);
}

const CEINTURE_8 = [c8_distributivite, c8_calcul_combine, c8_grands_nombres, c8_mix];

function genererItem(numeroCeinture, rng = Math.random) {
  const ceinture = CEINTURES[numeroCeinture - 1];
  if (!ceinture) throw new Error(`Ceinture inconnue : ${numeroCeinture}`);
  const generateur = pick(ceinture.generateurs, rng);
  return generateur(rng);
}

/* ==========================================================================
   Gestion des données multi-élèves — généré depuis stockage.mjs
   ========================================================================== */
function creerStockageVide() {
  return { code: null, roster: [], eleves: {} };
}

function definirCode(store, code) {
  return { ...store, code: String(code).trim() };
}

function verifierCode(store, code) {
  return store.code !== null && store.code !== '' && String(code).trim() === store.code;
}

function ajouterEleve(store, nom) {
  const propre = String(nom).trim();
  if (!propre || store.roster.includes(propre)) return store;
  return { ...store, roster: [...store.roster, propre] };
}

function retirerEleve(store, nom) {
  const roster = store.roster.filter((n) => n !== nom);
  const eleves = { ...store.eleves };
  delete eleves[nom];
  return { ...store, roster, eleves };
}

function reinitialiserScoresEleve(store, nom) {
  const eleves = { ...store.eleves };
  delete eleves[nom];
  return { ...store, eleves };
}

function enregistrerScore(store, nom, numeroCeinture, score, seuilReussite) {
  const roster = store.roster.includes(nom) ? store.roster : [...store.roster, nom];
  const eleves = { ...store.eleves };
  const donneesEleve = { ...(eleves[nom] || {}) };
  const precedent = donneesEleve[numeroCeinture] || { meilleurScore: 0, valide: false, tentatives: 0, date: null };
  const valide = precedent.valide || score >= seuilReussite;
  donneesEleve[numeroCeinture] = {
    meilleurScore: Math.max(precedent.meilleurScore, score),
    valide,
    tentatives: precedent.tentatives + 1,
    date: !precedent.valide && valide ? new Date().toISOString() : precedent.date,
  };
  eleves[nom] = donneesEleve;
  return { ...store, roster, eleves };
}

function fusionnerEntreeCeinture(a, b) {
  if (!a) return b;
  if (!b) return a;
  return {
    meilleurScore: Math.max(a.meilleurScore, b.meilleurScore),
    valide: a.valide || b.valide,
    tentatives: (a.tentatives || 0) + (b.tentatives || 0),
    date: a.date && b.date ? (a.date < b.date ? a.date : b.date) : a.date || b.date || null,
  };
}

function fusionnerStockages(local, importe) {
  const roster = [...local.roster];
  importe.roster.forEach((n) => {
    if (!roster.includes(n)) roster.push(n);
  });

  const eleves = {};
  const noms = new Set([...Object.keys(local.eleves), ...Object.keys(importe.eleves)]);
  noms.forEach((nom) => {
    const a = local.eleves[nom] || {};
    const b = importe.eleves[nom] || {};
    const numeros = new Set([...Object.keys(a), ...Object.keys(b)]);
    const fusion = {};
    numeros.forEach((num) => {
      fusion[num] = fusionnerEntreeCeinture(a[num], b[num]);
    });
    eleves[nom] = fusion;
  });

  return { code: local.code, roster, eleves };
}

function champCSV(valeur) {
  const s = String(valeur);
  if (/[;"\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function genererCSV(store) {
  const entetes = ['Élève', ...CEINTURES.map((c) => 'Ceinture ' + c.nom)];
  const lignes = [entetes];
  store.roster.forEach((nom) => {
    const ligne = [nom];
    CEINTURES.forEach((c) => {
      const info = store.eleves[nom] && store.eleves[nom][c.numero];
      ligne.push(info ? (info.valide ? 'Validée (' + info.meilleurScore + '/10)' : info.meilleurScore + '/10') : '');
    });
    lignes.push(ligne);
  });
  return lignes.map((ligne) => ligne.map(champCSV).join(';')).join('\r\n');
}

    var node = document.createElement(tag);

      Object.keys(props).forEach(function (k) {
        if (k === 'class') node.className = props[k];
        else if (k === 'text') node.textContent = props[k];
        else if (k.indexOf('on') === 0 && typeof props[k] === 'function') node.addEventListener(k.slice(2), props[k]);
        else node.setAttribute(k, props[k]);
      });
    }
    (enfants || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function vider(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function telechargerFichier(nomFichier, contenu, type) {
    var blob = new Blob([contenu], { type: type });
    var url = URL.createObjectURL(blob);
    var lien = document.createElement('a');
    lien.href = url;
    lien.download = nomFichier;
    document.body.appendChild(lien);
    lien.click();
    document.body.removeChild(lien);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function dateFichier() {
    var d = new Date();
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());

      valider('', item, enonce, reponseAffichee, true);

  }

  function valider(valeur, item, enonce, reponseAffichee, tempsEcoule) {
    if (session.dejaValide) return;
    session.dejaValide = true;
    clearTimeout(session.timeoutId);

    var correct = !tempsEcoule && checkAnswer(item, valeur);
    session.scores.push(correct ? 1 : 0);

    var boutons = app.querySelectorAll('.bouton-choix, .bouton-valider, .champ-reponse');

    enonce.classList.add(correct ? 'correct' : 'incorrect');

      reponseAffichee.textContent = tempsEcoule ? 'Temps écoulé — réponse : ' + item.reponse : 'Réponse : ' + item.reponse;

      reponseAffichee.textContent = '✓';

      if (session.index < NB_QUESTIONS) {

      rafraichirTableau();
    }
    champNom.addEventListener('keydown', function (e) { if (e.key === 'Enter') ajouter(); });
    app.appendChild(el('div', { class: 'bloc' }, [
      el('h2', { text: 'Classe' }),
      el('div', { class: 'ligne-formulaire' }, [
        champNom,
        el('button', { class: 'bouton-principal', type: 'button', text: 'Ajouter', onclick: ajouter }),
      ]),
      listeClasse,
    ]));
    rafraichirListe();

    // Tableau de suivi -------------------------------------------------
    var zoneTableau = el('div', { class: 'zone-scroll' });
    function rafraichirTableau() {
      vider(zoneTableau);
      var noms = store.roster.slice().sort(function (a, b) { return a.localeCompare(b, 'fr'); });
      if (noms.length === 0) {
        zoneTableau.appendChild(el('p', { class: 'message-vide', text: 'Aucun élève dans la classe.' }));
        return;
      }
      var thead = el('tr', {}, [el('th', { class: 'nom-eleve', text: 'Élève' })].concat(
        CEINTURES.map(function (c) { return el('th', { text: c.numero + ' ' + c.nom }); })
      ));
      var lignes = [thead];
      noms.forEach(function (nom) {
        var donnees = store.eleves[nom] || {};
        var cellules = [el('td', { class: 'nom-eleve', text: nom })];
        CEINTURES.forEach(function (c) {
          var info = donnees[c.numero];
          if (!info) {
            cellules.push(el('td', { class: 'non-tente', text: '–' }));
          } else {
            cellules.push(el('td', {
              class: info.valide ? 'valide' : '',
              text: (info.valide ? '✓ ' : '') + info.meilleurScore + '/' + NB_QUESTIONS,
            }));
          }
        });
        lignes.push(el('tr', {}, cellules));
      });
      zoneTableau.appendChild(el('table', { class: 'suivi' }, lignes));
    }
    rafraichirTableau();

    app.appendChild(el('div', { class: 'bloc' }, [
      el('h2', { text: 'Tableau de suivi' }),
      zoneTableau,
    ]));

    // Export / import / réinitialisation -------------------------------
    var messageEtat = el('p', { class: 'message-etat' });
    var champImport = el('input', { type: 'file', accept: 'application/json' });
    champImport.addEventListener('change', function () {
      var fichier = champImport.files[0];
      if (!fichier) return;
      var lecteur = new FileReader();
      lecteur.onload = function () {
        try {
          var importe = JSON.parse(lecteur.result);
          if (!importe || !Array.isArray(importe.roster) || typeof importe.eleves !== 'object') {
            throw new Error('format invalide');
          }
          store = fusionnerStockages(store, importe);
          sauverStore();
          rafraichirListe();
          rafraichirTableau();
          messageEtat.className = 'message-etat succes';
          messageEtat.textContent = 'Import réussi : les données ont été fusionnées.';
        } catch (e) {
          messageEtat.className = 'message-etat erreur';
          messageEtat.textContent = 'Fichier invalide : impossible d’importer ces données.';
        }
      };
      lecteur.readAsText(fichier);
      champImport.value = '';
    });

    app.appendChild(el('div', { class: 'bloc' }, [
      el('h2', { text: 'Données' }),
      el('p', { class: 'sous-titre', text: 'Pour rassembler les résultats de plusieurs tablettes, exportez depuis chacune puis importez les fichiers sur un même appareil.' }),
      el('div', { class: 'actions-enseignant' }, [
        el('button', { class: 'bouton-secondaire', type: 'button', text: 'Exporter les données (JSON)', onclick: function () {
          telechargerFichier('ceintures-cm2-' + dateFichier() + '.json', JSON.stringify(store, null, 2), 'application/json');
        } }),
        el('button', { class: 'bouton-secondaire', type: 'button', text: 'Exporter le tableau (CSV)', onclick: function () {
          telechargerFichier('tableau-suivi-' + dateFichier() + '.csv', '﻿' + genererCSV(store), 'text/csv;charset=utf-8');
        } }),
        el('label', { class: 'bouton-secondaire bouton-fichier' }, [document.createTextNode('Importer un fichier JSON'), champImport]),
      ]),
      messageEtat,
    ]));

    app.appendChild(el('div', { class: 'bloc' }, [
      el('h2', { text: 'Zone sensible' }),
      el('div', { class: 'actions-enseignant' }, [
        el('button', { class: 'bouton-danger', type: 'button', text: 'Changer le code enseignant', onclick: function () {
          var nouveau = window.prompt('Nouveau code à 4 chiffres :');
          if (nouveau === null) return;
          if (!/^\d{4}$/.test(nouveau.trim())) { window.alert('Le code doit contenir exactement 4 chiffres.'); return; }
          store = definirCode(store, nouveau.trim());
          sauverStore();
        } }),
        el('button', { class: 'bouton-danger', type: 'button', text: 'Tout réinitialiser', onclick: function () {
          if (window.confirm('Supprimer définitivement toute la classe et tous les scores sur cet appareil ?')) {
            store = creerStockageVide();
            sauverStore();
            afficherIdentification();
          }
        } }),
      ]),
    ]));
  }

  afficherIdentification();
})();
</script>
</body>
</html>
